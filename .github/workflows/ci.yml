name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore missing Rollup Linux binding
        run: npm install --no-save --package-lock=false --ignore-scripts @rollup/rollup-linux-x64-gnu@4.62.2
      - name: Build API
        run: npm --workspace apps/api run build
      - name: Build Worker
        run: npm --workspace apps/worker run build
      - name: Build Web
        run: npm --workspace apps/web run build
        env:
          VITE_API_URL: /api

  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore missing Rollup Linux binding
        run: npm install --no-save --package-lock=false --ignore-scripts @rollup/rollup-linux-x64-gnu@4.62.2
      - run: node scripts/safe-artifact.test.cjs
      - run: npx --no-install vitest run --config vitest.config.ts packages/utils/src/__tests__/financial-state.test.ts
      - run: npm --workspace packages/execution-layer run test
      - run: npm --workspace packages/monetary run test
      - run: npx --no-install vitest run --config vitest.config.ts apps/worker/src/__tests__/cycle.test.ts
